<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusDocs Phone Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .status-bar {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;
        }
        
        .status-dot.connected {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }
        
        .status-dot.streaming {
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }
        
        .status-text {
            font-weight: 500;
            color: #555;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: #667eea;
            border-radius: 2px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            background: white;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .camera-preview {
            background: #000;
            border-radius: 10px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .camera-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .preview-placeholder {
            color: #666;
            text-align: center;
        }
        
        .preview-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #e5e7eb;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }
        
        .checkbox-label {
            margin: 0;
            cursor: pointer;
            user-select: none;
        }
        
        .log-container {
            background: #1f2937;
            border-radius: 10px;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #10b981;
            margin-top: 20px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            word-break: break-all;
        }
        
        .log-entry.error {
            color: #ef4444;
        }
        
        .log-entry.info {
            color: #3b82f6;
        }
        
        .log-entry.warning {
            color: #f59e0b;
        }
        
        @media (max-width: 600px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 NexusDocs Phone Companion</h1>
        <p class="subtitle">Stream your phone camera to NexusDocs</p>
        
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Disconnected</span>
            </div>
            <div id="connectionInfo">WebSocket: Not connected</div>
        </div>
        
        <!-- Camera Preview -->
        <div class="section">
            <div class="section-title">Camera Preview</div>
            <div class="camera-preview" id="cameraPreview">
                <div class="preview-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                    <p>Camera preview will appear here</p>
                </div>
            </div>
        </div>
        
        <!-- Camera Selection -->
        <div class="section">
            <div class="section-title">Camera Settings</div>
            <div class="form-group">
                <label for="cameraSelect">Select Camera</label>
                <select id="cameraSelect">
                    <option value="">Loading cameras...</option>
                </select>
            </div>
            
            <div class="settings-grid">
                <div class="form-group">
                    <label for="resolution">Resolution</label>
                    <select id="resolution">
                        <option value="640x480">640x480 (VGA)</option>
                        <option value="1280x720" selected>1280x720 (HD)</option>
                        <option value="1920x1080">1920x1080 (Full HD)</option>
                        <option value="3840x2160">3840x2160 (4K)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="fps">Frame Rate (FPS)</label>
                    <select id="fps">
                        <option value="15">15 FPS</option>
                        <option value="24">24 FPS</option>
                        <option value="30" selected>30 FPS</option>
                        <option value="60">60 FPS</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- WebSocket Configuration -->
        <div class="section">
            <div class="section-title">WebSocket Server</div>
            <div class="settings-grid">
                <div class="form-group">
                    <label for="wsPort">Port</label>
                    <input type="number" id="wsPort" value="8765" min="1024" max="65535">
                </div>
                
                <div class="form-group">
                    <label for="wsHost">Host</label>
                    <input type="text" id="wsHost" value="localhost">
                </div>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="autoStart" />
                <label for="autoStart" class="checkbox-label">Auto-start on boot</label>
            </div>
        </div>
        
        <!-- Control Buttons -->
        <div class="button-group">
            <button id="btnStart" class="btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                Start Streaming
            </button>
            <button id="btnStop" class="btn-danger" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="6" width="12" height="12"/>
                </svg>
                Stop Streaming
            </button>
        </div>
        
        <!-- Activity Log -->
        <div class="section">
            <div class="section-title">Activity Log</div>
            <div class="log-container" id="logContainer">
                <div class="log-entry info">[INFO] Application started</div>
            </div>
        </div>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
